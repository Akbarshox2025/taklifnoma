<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To'lqin & Ismoil — Nikoh To'yi</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  min-height:100vh;
  background:#f7efe8;
  font-family:'Jost',sans-serif;
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(163,196,218,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 90%, rgba(163,196,218,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 15%, rgba(210,185,150,0.12) 0%, transparent 50%),
    #f7efe8;
  z-index:0;
}

/* ===== CARD WRAP ===== */
.wrap{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:2rem 1rem;
}

.card{
  position:relative;
  width:100%;max-width:520px;
  background:#fff;
  border-radius:4px;
  box-shadow:0 30px 100px rgba(100,80,60,0.18), 0 2px 0 rgba(163,196,218,0.4);
  overflow:visible;
  animation:borderGlow 4s 2s ease-in-out infinite;
}

/* ===== FLOWERS — SVG corners ===== */
.flowers{position:absolute;pointer-events:none;}
.flowers.tl{top:-60px;left:-60px;width:220px;height:220px;}
.flowers.tr{top:-60px;right:-60px;width:220px;height:220px;transform:scaleX(-1);}
.flowers.bl{bottom:-60px;left:-60px;width:200px;height:200px;transform:scaleY(-1);}
.flowers.br{bottom:-60px;right:-60px;width:200px;height:200px;transform:scale(-1);}

/* ===== INNER ===== */
.inner{
  padding:3.5rem 3rem 3rem;
  text-align:center;
  position:relative;z-index:2;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(0.85);}
  to{opacity:1;transform:scale(1);}
}
@keyframes shimmer{
  0%,100%{opacity:0.7;}
  50%{opacity:1;}
}
@keyframes floatPetal{
  0%{transform:translateY(-10px) rotate(0deg);opacity:0;}
  10%{opacity:0.7;}
  90%{opacity:0.3;}
  100%{transform:translateY(105vh) rotate(540deg);opacity:0;}
}
@keyframes bloomIn{
  0%{transform:scale(0) rotate(-20deg);opacity:0;}
  60%{transform:scale(1.08) rotate(3deg);opacity:1;}
  100%{transform:scale(1) rotate(0deg);opacity:1;}
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  14%{transform:scale(1.05);}
  28%{transform:scale(1);}
  42%{transform:scale(1.04);}
  56%{transform:scale(1);}
}
@keyframes goldShimmer{
  0%{background-position:200% center;}
  100%{background-position:-200% center;}
}
@keyframes sparkle{
  0%,100%{transform:scale(0) rotate(0deg);opacity:0;}
  50%{transform:scale(1) rotate(180deg);opacity:1;}
}
@keyframes borderGlow{
  0%,100%{box-shadow:0 30px 100px rgba(100,80,60,0.18),0 0 0 rgba(138,175,202,0);}
  50%{box-shadow:0 30px 100px rgba(100,80,60,0.22),0 0 30px 6px rgba(138,175,202,0.2);}
}
@keyframes waveFloat{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-6px);}
}

/* anim helpers */
.a1{opacity:0;animation:fadeUp .9s .2s ease forwards;}
.a2{opacity:0;animation:fadeUp .9s .5s ease forwards;}
.a3{opacity:0;animation:scaleIn 1s .7s ease forwards;}
.a4{opacity:0;animation:fadeUp .8s .95s ease forwards;}
.a5{opacity:0;animation:fadeUp .8s 1.1s ease forwards;}
.a6{opacity:0;animation:fadeUp .8s 1.25s ease forwards;}
.a7{opacity:0;animation:fadeUp .8s 1.4s ease forwards;}
.a8{opacity:0;animation:fadeUp .8s 1.55s ease forwards;}
.a9{opacity:0;animation:fadeIn .8s 1.7s ease forwards;}
.fl-anim{opacity:0;animation:bloomIn 1.2s .1s ease forwards;}

/* ===== ELEMENTS ===== */
.top-label{
  font-size:10px;letter-spacing:.3em;
  color:#8aafca;text-transform:uppercase;
  margin-bottom:1.8rem;
}

.invite-text{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;letter-spacing:.18em;
  color:#7a9ab0;text-transform:uppercase;
  line-height:1.8;
  margin-bottom:1.5rem;
}

/* name script */
.names{
  font-family:'Great Vibes',cursive;
  font-size:64px;
  color:#2c4a5e;
  line-height:1.15;
  margin-bottom:.3rem;
  animation:scaleIn 1s .7s ease forwards, heartbeat 3s 2s ease-in-out infinite;
  opacity:0;
}
.amp{
  font-family:'Great Vibes',cursive;
  font-size:48px;
  color:#8aafca;
  display:inline-block;
  margin:0 .3rem;
}

/* divider */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:1.6rem auto;
  max-width:320px;
}
.div-line{
  flex:1;height:.5px;
  background:linear-gradient(90deg,transparent,#b5d0e0,transparent);
}
.div-dot{
  width:5px;height:5px;
  background:#8aafca;
  border-radius:50%;
  animation:shimmer 2s ease-in-out infinite;
}

.sub-text{
  font-size:11px;letter-spacing:.2em;
  color:#9aafbc;text-transform:uppercase;
  margin-bottom:2rem;
}

/* date */
.date-row{
  display:flex;align-items:center;justify-content:center;gap:0;
  margin:1.5rem 0;
}
.d-block{
  text-align:center;padding:0 1.5rem;
}
.d-block .top{
  font-size:10px;letter-spacing:.25em;
  color:#8aafca;text-transform:uppercase;margin-bottom:6px;
}
.d-block .big{
  font-family:'Cormorant Garamond',serif;
  font-size:52px;font-weight:300;
  color:#2c4a5e;line-height:1;
}
.d-block .small{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:300;
  color:#2c4a5e;line-height:1;
}
.d-block .sub{
  font-size:9px;letter-spacing:.2em;
  color:#9aafbc;text-transform:uppercase;margin-top:4px;
}
.d-sep{
  width:1px;height:55px;
  background:linear-gradient(180deg,transparent,#b5d0e0,transparent);
}

/* time */
.time-line{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;font-weight:300;
  color:#2c4a5e;
  letter-spacing:.1em;
  margin:-.3rem 0 1.5rem;
}

/* location */
.location{
  background:linear-gradient(135deg,#eef5f9,#f0ebe4);
  border:.5px solid rgba(138,175,202,.3);
  border-radius:3px;
  padding:1.2rem 1.8rem;
  margin:0 0 1.5rem;
}
.location .lbl{
  font-size:9px;letter-spacing:.25em;
  color:#8aafca;text-transform:uppercase;
  margin-bottom:8px;
}
.location .val{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;color:#2c4a5e;
  line-height:1.5;
}

.footer-msg{
  font-size:11px;letter-spacing:.25em;
  color:#8aafca;text-transform:uppercase;
  margin-bottom:1.5rem;
  animation:fadeUp .8s 1.55s ease forwards, waveFloat 3s 2.5s ease-in-out infinite;
  opacity:0;
}

/* copy btn */
.copy-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 30px;
  border:.5px solid #8aafca;
  background:transparent;
  color:#5a8aaa;
  font-family:'Jost',sans-serif;
  font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;
  cursor:pointer;
  border-radius:2px;
  transition:all .3s;
}
.copy-btn:hover{background:#8aafca;color:#fff;}
.copied-msg{
  font-size:11px;color:#8aafca;
  letter-spacing:.1em;min-height:20px;
  margin-top:8px;
}

/* ===== PETALS ===== */
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.petal{
  position:absolute;
  border-radius:50% 0;
  opacity:0;
  animation:floatPetal linear infinite;
}
</style>

<script>
// Sparkle stars
const sparkleColors=['rgba(163,196,218,0.8)','rgba(210,185,150,0.8)','rgba(200,220,200,0.7)'];
for(let i=0;i<18;i++){
  const s=document.createElement('div');
  const sz=Math.random()*6+4;
  s.style.cssText=`
    position:fixed;
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    width:${sz}px;height:${sz}px;
    background:${sparkleColors[Math.floor(Math.random()*sparkleColors.length)]};
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:sparkle ${Math.random()*3+2}s ${Math.random()*5}s ease-in-out infinite;
    pointer-events:none;z-index:0;
  `;
  document.body.appendChild(s);
}
// Floating petals
const container = document.getElementById('petals');
const colors = [
  'rgba(163,196,218,0.6)',
  'rgba(138,175,202,0.5)',
  'rgba(210,185,150,0.5)',
  'rgba(220,195,160,0.4)',
  'rgba(180,210,200,0.45)'
];
for(let i=0;i<30;i++){
  const p=document.createElement('div');
  p.className='petal';
  const s=Math.random()*8+5;
  const shapes=['50% 0','0 50%','50% 50%','30% 70%'];
  p.style.cssText=`
    left:${Math.random()*100}%;
    width:${s}px;height:${s*1.4}px;
    background:${colors[Math.floor(Math.random()*colors.length)]};
    border-radius:${shapes[Math.floor(Math.random()*shapes.length)]};
    animation-duration:${Math.random()*10+8}s;
    animation-delay:${Math.random()*12}s;
  `;
  container.appendChild(p);
}

function copyInvite(){
  const txt=`💙 To'lqinjon & Shohsanam — Nikoh To'yi\n\nNikoh kechamizga taklif etamiz!\n\n📅 19-iyun 2026 (Juma), soat 19:00\n📍 Jizzax viloyati, G'allaorol tumani\nLalmikor shaharchasi, "Lola" to'yxonasi\n\nSizlarni kutib qolamiz! 🌸`;
  navigator.clipboard.writeText(txt).then(()=>{
    const el=document.getElementById('copiedMsg');
    el.textContent='✓ Nusxa olindi!';
    setTimeout(()=>el.textContent='',2500);
  });
}
</script>
